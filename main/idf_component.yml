dependencies:
  idf: ">=5.5.4"

  espressif/esp_codec_dev: "~1.5"
  espressif/expat: "^2.9.0"

  # MIPI-DSI AMOLED UI.
  lvgl/lvgl: "~9.3"
  espressif/esp_lvgl_port: "^2.6"

  espressif/esp_wifi_remote:
    version: ">=1.6.1,<2.0"
    rules:
      - if: "target in [esp32p4]"

  # LilyGO's ESP-Hosted fork adds esp_hosted_sdio_set_reset_callback(), which we
  # need because the C6 EN line sits on the XL9535 I/O expander, not a GPIO.
  # Must match the ESP-Hosted slave firmware flashed on the C6 (LilygoBox
  # network-adapter image). Populate with: git submodule update --init
  espressif/esp_hosted:
    override_path: "../third_party/esp_hosted"
    rules:
      - if: "target in [esp32p4]"
