; PlatformIO build for scheff-echolink, mirroring camillia-mt's P4 target.
; PlatformIO fetches and manages ESP-IDF itself, so no separate ESP-IDF install
; is needed. Plain `idf.py` against an ESP-IDF v5.5.4+ checkout still works too.
;
; Build with scripts/build-upload-monitor.sh: like camillia-mt it runs pio with
; a separate core dir (~/.platformio-p4) so this pioarduino platform cannot be
; replaced by the espressif32 versions other projects resolve.

[platformio]
src_dir = main
default_envs = tdisplay-p4
boards_dir = boards

; LilyGO T-Display P4 V1.0 (ECO2 silicon, pre rev 3.0).
[env:tdisplay-p4]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = tdisplay_p4
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 1500000

board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv

; sdkconfig.pio.defaults adds the ECO2 chip revision and a fix for the space in
; the project path; see that file.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.pio.defaults

; M5Stack Tab5 (ESP32-P4 pre rev 3.0 + ESP32-C6, 16 MB flash, 32 MB PSRAM).
[env:tab5]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = tab5
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 1500000

board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.pio.defaults;sdkconfig.pio.tab5.defaults

; LilyGO T-Deck Plus (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM).
[env:tdeck-plus]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = tdeck_plus
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.tdeck-plus.defaults

; Seeed Wio Tracker L2 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM).
[env:wio-tracker-l2]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = wio_tracker_l2
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.wio-tracker-l2.defaults
